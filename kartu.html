<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kartu</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial;
        }
        .kartu {
            background-color: white;
            width: 300px;
            margin: 50px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        .foto {
            border-radius: 50%;
            width: 100px;
        }
        .pekerjaan {
            color: gray;
            margin-top:-10px;
        }
        .btn-kontak {
            background-color: #020066;
            color: white;
            padding: 10px 15px;
            margin-left: 20px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <img src="Sho.jpg" alt="cwo fiksi ku" class="foto">
        <h2>Meylani P.</h2>
        <p class="pekerjaan">Cyber Security</p>
        <p>Siswi XI RPL yang bercita-cita menjadi seorang ahli keamanan siber.</p>
        <button class="btn-kontak">Hubungi Saya</button>
    </div>
</body>
</html>
